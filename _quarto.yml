lang: en

project:
  type: website
  output-dir: docs
  resources:
    - assets/fonts/OFL-*.txt
    - assets/enso-spiral.js
  render:
    - "*.qmd"
    - "blog/**/*.qmd"

website:
  title: "Jeison Mesa"
  description: "Statistician and data scientist. Time series, state-space models and machine learning in R and Python."
  site-url: https://jeikosd.github.io
  favicon: assets/favicon.svg
  open-graph:
    image: assets/social-card.png
    image-width: 1200
    image-height: 630
    image-alt: "Jeison Mesa, statistician and data scientist"
  twitter-card:
    card-style: summary_large_image
    image: assets/social-card.png
    image-alt: "Jeison Mesa, statistician and data scientist"
  navbar:
    right:
      - href: about.qmd
        text: About
      - href: blog/index.qmd
        text: Blog
      - href: projects.qmd
        text: Projects
      - href: publications.qmd
        text: Publications
      - href: cv.qmd
        text: CV
      - icon: github
        href: https://github.com/Jeikosd
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/jeison-mesa-27149ab5
        aria-label: LinkedIn
  page-footer:
    border: false
    left: "© 2026 Jeison Mesa · Made with Quarto"

format:
  html:
    theme:
      light: [assets/light.scss, assets/site.scss]
      dark: [assets/dark.scss, assets/site.scss]
    respect-user-color-scheme: true
    canonical-url: true
    toc: false
    grid:
      body-width: 760px
    highlight-style: github
    include-in-header:
      - text: |
          <link rel="alternate" type="application/rss+xml" title="Jeison Mesa" href="https://jeikosd.github.io/blog/index.xml">
          <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Jeison Mesa","url":"https://jeikosd.github.io","jobTitle":"Statistician and data scientist","sameAs":["https://github.com/Jeikosd","https://www.linkedin.com/in/jeison-mesa-27149ab5","https://scholar.google.com/citations?user=ZPe2yT4AAAAJ"]}</script>
