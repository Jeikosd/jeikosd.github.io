project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "blog/**/*.qmd"

website:
  title: "Jeison Mesa"
  description: "Statistician and data scientist. Time series, state-space models and machine learning in R and Python."
  site-url: https://jeikosd.github.io
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    right:
      - href: about.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: publications.qmd
        text: Publications
      - href: blog/index.qmd
        text: Blog
      - href: cv.qmd
        text: CV
      - icon: github
        href: https://github.com/Jeikosd
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/jeikosd
        aria-label: LinkedIn
  page-footer:
    border: false
    left: "© 2026 Jeison Mesa"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [assets/light.scss, assets/site.scss]
      dark: [assets/dark.scss, assets/site.scss]
    respect-user-color-scheme: true
    toc: false
    grid:
      body-width: 760px
    highlight-style: github
